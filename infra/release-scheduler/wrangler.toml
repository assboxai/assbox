name = "assbox-release-scheduler"
main = "worker.mjs"
compatibility_date = "2026-09-11"
workers_dev = false
preview_urls = false

[triggers]
crons = ["23 7 * * *"]

[vars]
# Public identifiers only. Provision real values; zeros deliberately refuse dispatch.
# Repository/owner values must match release/policy.json.
GITHUB_APP_CLIENT_ID = "UNPROVISIONED"
GITHUB_APP_INSTALLATION_ID = "0"
GITHUB_REPOSITORY_ID = "0"
GITHUB_OWNER_ID = "0"

# GITHUB_APP_PRIVATE_KEY is a secret binding, NEVER a [vars] entry.
# No routes, KV, database, queue, billing upgrade or public dispatch endpoint.
