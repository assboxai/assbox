        - system: x86_64-linux
          runner: ubuntu-24.04
          application: claude-desktop
        - system: x86_64-linux
          runner: ubuntu-24.04
          application: codex
        - system: x86_64-linux
          runner: ubuntu-24.04
          application: cursor
        - system: x86_64-linux
          runner: ubuntu-24.04
          application: grok
        - system: x86_64-linux
          runner: ubuntu-24.04
          application: openclaw
        - system: x86_64-linux
          runner: ubuntu-24.04
          application: opencode
        - system: x86_64-linux
          runner: ubuntu-24.04
          application: happier
        - system: x86_64-linux
          runner: ubuntu-24.04
          application: hermes
        - system: x86_64-linux
          runner: ubuntu-24.04
