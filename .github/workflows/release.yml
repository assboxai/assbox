        - system: x86_64-linux
          runner: ubuntu-24.04
          application: omp
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: antigravity
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: chatgpt
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: claude-code
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: claude-desktop
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: codex
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: cursor
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: grok
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          application: openclaw
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
