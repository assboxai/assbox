name: Assbox development runner capabilities
'on':
  workflow_dispatch: null
permissions: {}
jobs:
  observe:
    if: github.repository == 'assboxai/assbox' && github.ref == 'refs/heads/dev' && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
        - system: x86_64-linux
          runner: ubuntu-24.04
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Observe native memory, storage and KVM without changing the runner
      shell: bash
      run: |
        set -euo pipefail
        /usr/bin/python3 -I -B - <<'PYTHON'
        import fcntl,json,os,pathlib,platform,shutil,stat
        facts=dict(schema=1,kind='assbox-development-runner-capabilities',repository=os.environ['GITHUB_REPOSITORY'],source_commit=os.environ['GITHUB_SHA'],source_ref=os.environ['GITHUB_REF'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),native_machine=platform.machine(),cpu_count=os.cpu_count(),filesystems=[])
        assert facts['repository']=='assboxai/assbox' and facts['source_ref']=='refs/heads/dev'
        for directory in ('/', '/mnt', os.environ['RUNNER_TEMP']):
         path=pathlib.Path(directory)
         if path.exists():
          usage=shutil.disk_usage(path)
          facts['filesystems'].append(dict(path=directory,device=path.stat().st_dev,total_bytes=usage.total,available_bytes=usage.free))
        mem={line.split(':')[0]:int(line.split()[1])*1024 for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith(('MemTotal:','MemAvailable:'))}
        facts['memory']=mem
        facts['kvm_api_version']=None
        try:
         descriptor=os.open('/dev/kvm',os.O_RDWR|os.O_CLOEXEC)
         try:facts['kvm_api_version']=fcntl.ioctl(descriptor,0xae00,0)
         finally:os.close(descriptor)
        except OSError as error:facts['kvm_access_error']=error.errno
        output=pathlib.Path(os.environ['RUNNER_TEMP'])/'assbox-runner-capabilities.json'
        output.write_text(json.dumps(facts,sort_keys=True,separators=(',',':'))+'\n')
        print(json.dumps(facts,sort_keys=True))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: runner-capabilities-${{ matrix.system }}
        path: ${{ runner.temp }}/assbox-runner-capabilities.json
        if-no-files-found: error
        retention-days: 14
