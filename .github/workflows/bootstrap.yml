# SPDX-License-Identifier: GPL-3.0-or-later
name: Bootstrap lock and format
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            max-jobs = 2
            cores = 2
      - name: Resolve genuine inputs and normalize with native tools
        run: |
          set -euo pipefail
          nix flake lock
          git add flake.lock
          nix develop --command scripts/format
          mkdir -p "$RUNNER_TEMP/assbox-bootstrap"
          git diff HEAD --binary > "$RUNNER_TEMP/assbox-bootstrap/bootstrap.patch"
          cp flake.lock "$RUNNER_TEMP/assbox-bootstrap/flake.lock"
          nix develop --command rustc --version > "$RUNNER_TEMP/assbox-bootstrap/rustc-version.txt"
          nix --version > "$RUNNER_TEMP/assbox-bootstrap/nix-version.txt"
      - name: Upload for review, not automatic publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assbox-bootstrap-review
          path: ${{ runner.temp }}/assbox-bootstrap
          if-no-files-found: error
