# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox native ARM state restore candidate qualification
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-state-restore-v1
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-state-restore-v1' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      PRODUCT_COMMIT: 106eaec3f3d14641094035323385f1b8319def75
      PRODUCT_TREE: 2997d296e6a64e862e21c267edaa32a021754fbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Verify candidate identity and run native finite gates
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'ea86256a5c0755b5dc022ef446202ea28b404144a7a2eb2202199a58c3ec57b7  flake.lock' \
            '10e9eb6ad0cc12447dbea4fd76160c1b8a14ba1bdaa3e5ff0eadc1ae218b4997  scripts/release-check' \
            | sha256sum --check
          evidence="$RUNNER_TEMP/assbox-arm-state-restore"
          mkdir -m 0700 "$evidence"
          {
            date -u +%FT%TZ
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD 'HEAD^{tree}'
            sha256sum flake.lock scripts/release-check
            uname -sm
            df -h /nix/store "$RUNNER_TEMP"
            nix --version
          } > "$evidence/scope.txt"
          export XDG_STATE_HOME="$RUNNER_TEMP/assbox-arm-chainman-state"
          mkdir -m 0700 "$XDG_STATE_HOME"
          run_finite() {
            local command_name=$1
            local result=0
            nix run path:./nix/dev#just -- "$@" > "$evidence/finite-$command_name.log" 2>&1 || result=$?
            printf '%s\t%s\t%s\n' "$command_name" "$result" "$(date -u +%FT%TZ)" >> "$evidence/finite.tsv"
            return "$result"
          }
          run_finite setup --no-hooks
          run_finite doctor
          run_finite explain verify --json
          run_finite deps-check
          run_finite deps-coverage
          run_finite deps-policy-report
          run_finite verify-lite
          run_finite verify-prepare
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-arm-state-restore-finite
          path: |
            ${{ runner.temp }}/assbox-arm-state-restore/scope.txt
            ${{ runner.temp }}/assbox-arm-state-restore/finite.tsv
            ${{ runner.temp }}/assbox-arm-state-restore/finite-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Realize the exact ARM state helper
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          evidence="$RUNNER_TEMP/assbox-arm-state-restore"
          sha256sum --check <<'SUMS'
          fd98d68b9e9c0b5d38c8dbdbf1a53a4e39f5ff27ed5d6a95dfa2a4979a5b9086  scripts/state/snapshot.py
          SUMS
          export NIX_CONFIG="max-jobs = 1
          cores = 2"
          expr='let f = builtins.getFlake (toString ./.); c = f.nixosConfigurations.aarch64-linux-uefi-none-headless.config; in builtins.head (builtins.filter (p: p.name == "assbox-state") c.environment.systemPackages)'
          drv=$(nix eval --impure --raw --no-update-lock-file --no-write-lock-file --expr "($expr).drvPath")
          built=$(nix build --no-link --impure --print-out-paths --no-update-lock-file --no-write-lock-file --expr "$expr" 2>"$evidence/state-helper-build.log")
          test "$(nix path-info --offline "$built")" = "$built"
          "$built/bin/assbox-state" --help > "$evidence/state-helper-help.txt"
          grep -F 'backup,list,restore' "$evidence/state-helper-help.txt"
          test -z "$(git status --porcelain)"
          printf '%s\n%s\n%s\n%s\n%s\n' "$PRODUCT_COMMIT" "$PRODUCT_TREE" "$(uname -sm)" "$drv" "$built" > "$evidence/state-helper-scope.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-arm-state-helper
          path: |
            ${{ runner.temp }}/assbox-arm-state-restore/state-helper-scope.txt
            ${{ runner.temp }}/assbox-arm-state-restore/state-helper-help.txt
            ${{ runner.temp }}/assbox-arm-state-restore/state-helper-build.log
          if-no-files-found: warn
          retention-days: 14
