# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox exact native ARM Clang cache for Chromium
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-chromium-clang-seeded-v2
  cancel-in-progress: false
jobs:
  seed:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-chromium-clang-seeded-v2' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      PRODUCT_COMMIT: 28bf6a68aad8860e412e5cd3d4f3788caef7edc1
      PRODUCT_TREE: 304515456bbb2d19c47226caf38a5a2c1083544a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Download the independently verified ARM LLVM seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14790289191'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45085837980'
          path: ${{ runner.temp }}/assbox-arm-llvm-seed-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and import the signed ARM LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/import-arm-llvm-seed.py \
            product "$RUNNER_TEMP/assbox-arm-llvm-seed-download" "$RUNNER_TEMP/assbox-arm-llvm-import.json"
      - name: Build exact ARM Chromium Clang inputs and validate the signed cache in two cold stores
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C product rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          evidence="$RUNNER_TEMP/assbox-arm-chromium-clang-seed-evidence"
          mkdir -m 0700 "$evidence"
          {
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git -C product rev-parse HEAD 'HEAD^{tree}'
            uname -sm
            nproc
            df -PB1 /nix/store "$RUNNER_TEMP"
            free -b
          } > "$evidence/scope.txt"
          monitor_resources() {
            while :; do
              {
                printf 'ARM Clang resource sample %s\n' "$(date -u +%FT%TZ)"
                df -PB1 /nix/store "$RUNNER_TEMP"
                free -b
                if test -r /sys/fs/cgroup/memory.events; then
                  cat /sys/fs/cgroup/memory.events
                fi
                if test -s "$evidence/native-build.log"; then
                  printf 'ARM Clang recent build output\n'
                  tail -n 7 "$evidence/native-build.log" |
                    sed -E 's#https?://[^[:space:]"<>]+#[download-url]#g'
                fi
              } | tee -a "$evidence/resources.log"
              sleep 120
            done
          }
          monitor_resources &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          /usr/bin/python3 -I -B authority/.github/experiments/native-arm-chromium-clang-seed.py "$PWD/product" "$evidence"
          test -s "$evidence/index.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-native-arm-chromium-clang-signed-seed
          path: |
            ${{ runner.temp }}/assbox-arm-chromium-clang-seed-evidence/index.json
            ${{ runner.temp }}/assbox-arm-chromium-clang-seed-evidence/signed-cache
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exact-native-arm-chromium-clang-seed-diagnostics
          path: |
            ${{ runner.temp }}/assbox-arm-llvm-import.json
            ${{ runner.temp }}/assbox-arm-chromium-clang-seed-evidence/expected.json
            ${{ runner.temp }}/assbox-arm-chromium-clang-seed-evidence/native-build.log
            ${{ runner.temp }}/assbox-arm-chromium-clang-seed-evidence/resources.log
            ${{ runner.temp }}/assbox-arm-chromium-clang-seed-evidence/scope.txt
          if-no-files-found: warn
          retention-days: 7
