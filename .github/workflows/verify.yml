# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox exact current native x86 authenticated plain UEFI
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-x86-current-signed-uefi512
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/x86-current-signed-uefi512' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      INPUT_GROUP: install-boot-uefi-512
      PRODUCT_COMMIT: d3d36054d98d1ccf3ab37853fd4c23b5621e72d5
      PRODUCT_TREE: ac7bc49124a59ad59bca1afde3d755dd88ec7370
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            sandbox = true
            sandbox-fallback = false
            system-features = benchmark big-parallel nixos-test kvm
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Verify KVM access as a Nix build user
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          evidence="$RUNNER_TEMP/assbox-native-signed-uefi512-evidence"
          mkdir -m 0700 "$evidence"
          df -PB1 /nix/store "$RUNNER_TEMP" > "$evidence/resources.txt"
          free -b >> "$evidence/resources.txt"
          user="$(/usr/bin/python3 -I -B -c 'import grp,pwd; g=grp.getgrnam("nixbld"); print(next(p.pw_name for p in pwd.getpwall() if p.pw_gid==g.gr_gid and p.pw_name.startswith("nixbld")))')"
          sudo /usr/bin/chgrp nixbld /dev/kvm
          sudo /usr/bin/chmod g+rw /dev/kvm
          sudo -n -u "$user" /usr/bin/python3 -I -B - > "$evidence/native-kvm-build-user.json" <<'PY'
          import fcntl
          import json
          import os
          import platform
          import pwd

          assert os.getuid() != 0 and platform.machine() == 'x86_64'
          device = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          try:
              version = fcntl.ioctl(device, 0xAE00, 0)
              assert version == 12
              vm = fcntl.ioctl(device, 0xAE01, 0)
              os.close(vm)
          finally:
              os.close(device)
          print(json.dumps({'architecture':platform.machine(), 'buildUser':pwd.getpwuid(os.getuid()).pw_name,
                            'apiVersion':version, 'createVm':True}))
          PY
      - name: Verify native kernel inputs and run the signed plain UEFI installer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          evidence="$RUNNER_TEMP/assbox-native-signed-uefi512-evidence"
          /usr/bin/python3 -I -B authority/.github/experiments/current-x86-signed-uefi512.py evaluate "$PWD/product" "$evidence"
          /usr/bin/python3 -I -B authority/.github/experiments/import-verified-x86-uefi512-kernel.py "$PWD/product" "$evidence"
          /usr/bin/python3 -I -B authority/.github/experiments/current-x86-signed-uefi512.py verify "$PWD/product" "$evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exact-current-native-x86-signed-uefi512
          path: ${{ runner.temp }}/assbox-native-signed-uefi512-evidence/
          retention-days: 14
          if-no-files-found: error
