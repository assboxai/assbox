        certificate[\\\''buildTrigger\\\''] not in (\\\''schedule\\\'', \\\''workflow_dispatch\\\'')):\\n        raise
        ValueError(\\\''Verified kernel certificate identity mismatch\\\'')\\n\\n\\ndef consume(source,
