# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox native hosted x86 capacity
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-x86-hosted-qualification-capacity
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/x86-hosted-qualification-capacity' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - name: Measure native x86 capacity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          evidence="$RUNNER_TEMP/assbox-x86-capacity"
          mkdir -m 0700 "$evidence"
          script=authority/.github/experiments/x86-runner-capacity.py
          /usr/bin/python3 -I -B "$script" > "$evidence/before.json"
          inherited=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP,GITHUB_REF
          sudo --preserve-env="$inherited" /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
          /usr/bin/python3 -I -B "$script" > "$evidence/after.json"
          sudo --preserve-env="$inherited" /usr/bin/python3 -I -B "$script" > "$evidence/privileged.json"
          cp "$RUNNER_TEMP/assbox-runner-clearance.json" "$evidence/clearance.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-x86-hosted-capacity
          path: ${{ runner.temp }}/assbox-x86-capacity/
          if-no-files-found: error
          retention-days: 7
