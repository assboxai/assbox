# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox native ARM policy matrix qualification
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-matrix-machine-packages
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-matrix-machine-packages' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      PRODUCT_COMMIT: 499bb884e4ae0774cd0f45da5ea157a723dd377d
      PRODUCT_TREE: 5fd29e09da7081eafe814ee6867f3098a6e880b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Build every policy check on native ARM
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'ea86256a5c0755b5dc022ef446202ea28b404144a7a2eb2202199a58c3ec57b7  flake.lock' \
            'ce121be6af0bf7e76c599e99905167096e62631ba048e77370a88a275e772d36  scripts/verify' \
            | sha256sum --check
          echo "EVALUATING ALL NATIVE ARM CHECK NAMES"
          evidence="$RUNNER_TEMP/arm-matrix-machine-packages"
          mkdir -m 0700 "$evidence"
          {
            printf 'authority\t%s\nrun\t%s\nattempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'source\t%s\ntree\t%s\n' "$PRODUCT_COMMIT" "$PRODUCT_TREE"
            printf 'platform\t%s\n' "$(nix eval --impure --raw --expr builtins.currentSystem)"
            sha256sum flake.lock scripts/verify
            nix --version
          } > "$evidence/source.txt"
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = aarch64-linux
          nix eval --json --no-update-lock-file --no-write-lock-file '.#checks.aarch64-linux' \
            --apply builtins.attrNames > "$evidence/check-names.json"
          expected=../authority/qualification/arm-matrix-machine-packages-checks.json
          cmp <(jq -c . "$expected") <(jq -c . "$evidence/check-names.json")
          mapfile -t policy_checks < <(jq -r '.[] | select(startswith("policy-aarch64-linux-"))' "$expected")
          test "${#policy_checks[@]}" -eq 49
          result=0
          for name in "${policy_checks[@]}"; do
            echo "NATIVE ARM POLICY $name"
            code=0
            nix build --no-link --print-out-paths --no-update-lock-file --no-write-lock-file --keep-going \
              ".#checks.aarch64-linux.$name" > "$evidence/$name.output" 2> "$evidence/$name.log" || code=$?
            printf '%s\t%s\n' "$name" "$code" >> "$evidence/policy-results.tsv"
            if test "$code" -ne 0; then
              result=$code
              tail -35 "$evidence/$name.log"
            fi
          done
          printf '%s\n' "$result" > "$evidence/collector.exit"
          test -z "$(git status --porcelain)"
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-arm-matrix-machine-packages
          path: ${{ runner.temp }}/arm-matrix-machine-packages
          if-no-files-found: warn
          retention-days: 14
