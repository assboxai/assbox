        ValueError(\\\''Cached kernel differs from the independently evaluated kernel\\\'')\\n    key
        = value[\\\''publicKey\\\'']\\n    if not isinstance(key, str) or not re.fullmatch(r\\\''assbox-kernel-[A-Za-z0-9_-]{1,100}:[A-Za-z0-9+/]{43}=\\\'',
