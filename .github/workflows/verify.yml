# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox reviewed OpenClaw native ARM runtime
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-openclaw-runtime-offline-assets
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-openclaw-runtime-offline-assets' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 260
    permissions:
      contents: read
    env:
      PRODUCT_COMMIT: 5077cb7cae5b9289b3e97d12689235ac0ab13283
      PRODUCT_TREE: b11ac271635a971eb454ef1bab91ecc5b59a60c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Build and check the exact native ARM OpenClaw runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'ea86256a5c0755b5dc022ef446202ea28b404144a7a2eb2202199a58c3ec57b7  flake.lock' \
            '10e9eb6ad0cc12447dbea4fd76160c1b8a14ba1bdaa3e5ff0eadc1ae218b4997  scripts/release-check' \
            | sha256sum --check
          evidence="$RUNNER_TEMP/assbox-arm-reviewed-openclaw"
          mkdir -m 0700 "$evidence"
          {
            date -u +%FT%TZ
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD 'HEAD^{tree}'
            sha256sum flake.lock scripts/release-check
            uname -sm
            df -h /nix/store "$RUNNER_TEMP"
            nix --version
          } > "$evidence/scope.txt"
          profile="git+file://$PWD?rev=$PRODUCT_COMMIT#nixosConfigurations.aarch64-linux-uefi-openclaw-headless"
          nix eval --json "$profile" --apply '
            system: {
              package = map (p: { inherit (p) drvPath; output = toString p; })
                (builtins.filter (p: builtins.match "openclaw-.+-assbox-entrypoint" (p.name or "") != null)
                  system.config.environment.systemPackages);
              tools = map (p: { inherit (p) drvPath; output = toString p; })
                (with system.pkgs; [ bubblewrap bash coreutils ]);
            }
          ' > "$evidence/bindings.json" 2> "$evidence/bindings.log"
          wrapper=$(jq -er '.package|if length == 1 then .[0].drvPath else error("OpenClaw wrapper selection") end' "$evidence/bindings.json")
          package=$(jq -er '.package[0].output' "$evidence/bindings.json")
          test "$wrapper" = /nix/store/phbk5fcd9qb200m65bbr8gpdazrl9hr6-openclaw-2026.11.7-assbox-entrypoint.drv
          test "$package" = /nix/store/sjk6s654qp2ddqcw11r4j8irj7rhmgnk-openclaw-2026.11.7-assbox-entrypoint
          raw=$(nix-store --query --references "$wrapper" | grep -E -- '-openclaw-2026[.]11[.]7[.]drv$')
          test "$raw" = /nix/store/8p34pgdkixhc9iccywlh66abbr457kwa-openclaw-2026.11.7.drv
          deps=$(nix-store --query --references "$raw" | grep -E -- '-openclaw-pnpm-deps[.]drv$')
          pnpm=$(nix-store --query --references "$raw" | grep -E -- '-pnpm-12[.]23[.]0[.]drv$')
          deps_output=$(nix-store --query --outputs "$deps")
          pnpm_output=$(nix-store --query --outputs "$pnpm")
          test "$deps_output" = /nix/store/2i5hfwwz0nhzikpbn2sg235jp1lzsxk4-openclaw-pnpm-deps
          nix build --no-link --print-out-paths --max-jobs 1 --cores "$(nproc)" -L "$deps^out" > "$evidence/dependencies.txt" 2> "$evidence/dependencies.log"
          test "$(cat "$evidence/dependencies.txt")" = "$deps_output"
          mapfile -t asset_drvs < <(nix-store --query --references "$raw" | grep -E -- '-fs-safe-darwin-(arm64|x64)-0[.]27[.]1[.]tgz[.]drv$')
          test "${#asset_drvs[@]}" -eq 2
          for asset in "${asset_drvs[@]}"; do
            nix build --no-link --print-out-paths "$asset^out"
          done > "$evidence/worker-assets.txt" 2> "$evidence/worker-assets.log"
          mapfile -t asset_outputs < "$evidence/worker-assets.txt"
          test "${#asset_outputs[@]}" -eq 2
          nix build --no-link --print-out-paths --max-jobs 1 --cores "$(nproc)" -L "$wrapper^out" > "$evidence/package.txt" 2> "$evidence/package.log"
          test "$(cat "$evidence/package.txt")" = "$package"
          nix path-info --offline --recursive --json --json-format 1 "$package" > "$evidence/runtime-closure.json"
          jq -e --arg deps "$deps_output" --arg pnpm "$pnpm_output" --arg first "${asset_outputs[0]}" --arg second "${asset_outputs[1]}" \
            '(has($deps)|not) and (has($pnpm)|not) and (has($first)|not) and (has($second)|not) and any(keys[]; endswith("-nodejs-24.22.3"))'             "$evidence/runtime-closure.json" > "$evidence/runtime-policy.txt"
          mapfile -t tool_drvs < <(jq -r '.tools[].drvPath + "^out"' "$evidence/bindings.json")
          nix build --no-link -L "${tool_drvs[@]}" > "$evidence/smoke-tools.txt" 2> "$evidence/smoke-tools.log"
          bubblewrap=$(jq -er '.tools[0].output' "$evidence/bindings.json")
          bash=$(jq -er '.tools[1].output' "$evidence/bindings.json")
          coreutils=$(jq -er '.tools[2].output' "$evidence/bindings.json")
          timeout 125 "$bubblewrap/bin/bwrap" --unshare-net --unshare-ipc --unshare-pid --unshare-uts \
            --new-session --die-with-parent --clearenv --ro-bind /nix/store /nix/store \
            --dev /dev --proc /proc --tmpfs /tmp --tmpfs /run --dir /tmp/home             --setenv HOME /tmp/home --setenv XDG_RUNTIME_DIR /run --setenv TERM dumb --setenv USER agent \
            --setenv OPENCLAW_DISABLE_BONJOUR 1 --setenv OPENCLAW_NO_RESPAWN 1 \
            --setenv PATH "$coreutils/bin" "$bash/bin/bash" -e -s -- "$package/bin/openclaw" \
            > "$evidence/native-smoke.log" 2> "$evidence/native-smoke.stderr" <<'SMOKE'
          launcher=$1
          mkdir -m 700 "$HOME/.openclaw"
          printf '%s\n' '{"gateway":{"mode":"local","bind":"loopback","auth":{"mode":"token","token":"disposable-test-token"}}}' > "$HOME/.openclaw/openclaw.json"
          "$launcher" --version
          "$launcher" gateway run --bind loopback --port 18789 >/tmp/gateway.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; tail -30 /tmp/gateway.log' EXIT
          deadline=$((SECONDS + 90))
          while test "$SECONDS" -lt "$deadline"; do
            if timeout 12 "$launcher" gateway health --url ws://127.0.0.1:18789 --token disposable-test-token > /tmp/health.log 2>&1; then
              cat /tmp/health.log
              printf 'Authenticated loopback health passed.\n'
              rejected=0
              timeout 12 "$launcher" gateway health --url ws://127.0.0.1:18789 --token incorrect-test-token > /tmp/negative.log 2>&1 || rejected=$?
              cat /tmp/negative.log
              test "$rejected" -ne 0 && test "$rejected" -ne 124 || exit 1
              timeout 12 "$launcher" gateway health --url ws://127.0.0.1:18789 --token disposable-test-token >/tmp/recheck.log 2>&1
              printf 'Incorrect disposable token rejected with exit %s.\n' "$rejected"
              exit 0
            fi
            kill -0 "$pid"
            sleep 1
          done
          cat /tmp/health.log
          exit 1
          SMOKE
          grep -E '^OpenClaw 2026[.]11[.]7([[:space:]]|$)' "$evidence/native-smoke.log"
          grep -Fx 'Authenticated loopback health passed.' "$evidence/native-smoke.log"
          grep -E '^Incorrect disposable token rejected with exit [1-9][0-9]*[.]$' "$evidence/native-smoke.log"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-openclaw-offline-assets-arm-native
          path: ${{ runner.temp }}/assbox-arm-reviewed-openclaw
          if-no-files-found: warn
          retention-days: 14
