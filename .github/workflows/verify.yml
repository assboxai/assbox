# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox native ARM installed headless CLI with verified inputs
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-installed-cli-verified-ghc
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-installed-cli-verified-ghc' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      PRODUCT_COMMIT: d3d36054d98d1ccf3ab37853fd4c23b5621e72d5
      PRODUCT_TREE: ac7bc49124a59ad59bca1afde3d755dd88ec7370
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Download the verified ARM llvm seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14790289191'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45085837980'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/llvm
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM nix-core seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14793257571'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45105620947'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/nix-core
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM rustc seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14796242324'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45113607681'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/rustc
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM clang seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14873761954'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45254317055'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/clang
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM nix-module seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14813051401'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45127478115'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/nix-module
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified native ARM Codex seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14932607181'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45401874682'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/codex
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM ghc-bootstrap seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14975520901'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45479605780'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/ghc-bootstrap
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM ghc-other seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14980129944'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45479605780'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/ghc-other
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM lapack seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14967233110'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45487757149'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/lapack
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM python-tools seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14953102275'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45443784497'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/python-tools
          skip-decompress: true
          digest-mismatch: error
      - name: Install and boot the exact native ARM headless profile
        timeout-minutes: 320
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          fixture="$PWD/authority/tests/acceptance/installed-headless-cli/fixture-current.nix"
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'ea86256a5c0755b5dc022ef446202ea28b404144a7a2eb2202199a58c3ec57b7  flake.lock' \
            '10e9eb6ad0cc12447dbea4fd76160c1b8a14ba1bdaa3e5ff0eadc1ae218b4997  scripts/release-check' \
            | sha256sum --check
          evidence="$RUNNER_TEMP/assbox-arm-installed-headless-cli"
          mkdir -m 0700 "$evidence"
          {
            date -u +%FT%TZ
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD 'HEAD^{tree}'
            sha256sum flake.lock scripts/release-check
            uname -sm
            df -h /nix/store "$RUNNER_TEMP"
            nix --version
          } > "$evidence/scope.txt"
          if test -c /dev/kvm; then
            printf 'kvmDevice\tavailable-unrequired\n' >> "$evidence/scope.txt"
          else
            printf 'kvmDevice\tunavailable\n' >> "$evidence/scope.txt"
          fi
          expression="let f = import $fixture { source = \"$PWD\"; revision = \"$PRODUCT_COMMIT\"; system = \"aarch64-linux\"; }; in { installed = toString f.actual; actual = f.actual.drvPath; test = f.test.drvPath; inherit (f) expectedProfile; }"
          nix eval --json --impure --no-update-lock-file --no-write-lock-file --option eval-cores 2 --expr "$expression" > "$evidence/evaluation.json"
          sha256sum "$fixture" "$(dirname "$fixture")/run-current-installed-cli.py" > "$evidence/fixture-sha256.txt"
          drv=$(jq -r '.test' "$evidence/evaluation.json")
          test "$drv" = "/nix/store/02c6cw7z7kzafvlnls1axlqbj3g5j93s-vm-test-run-assbox-current-installed-curated-headless.drv"
          test -r "$drv"
          /usr/bin/python3 -I -B ../authority/.github/experiments/import-arm-installed-cli-seeds.py \
            "$PWD" "$RUNNER_TEMP/assbox-installed-cli-seeds" "$evidence"
          /usr/bin/python3 -I -B ../authority/.github/experiments/import-arm-installed-kernel.py "$PWD" "$evidence"
          status=0
          nix build --no-link --print-out-paths --max-jobs 2 --cores 2 --keep-failed -L "$drv^*" > "$evidence/output-paths.txt" 2> "$evidence/native-install.log" || status=$?
          printf '%s\n' "$status" > "$evidence/status.exit"
          if test "$status" -ne 0; then
            tail -60 "$evidence/native-install.log" >&2
            exit "$status"
          fi
          kernel_drv=$(jq -er '.derivation' "$evidence/kernel-import.json")
          if grep -Fq "building '$kernel_drv'" "$evidence/native-install.log"; then
            echo "The installed fixture rebuilt its verified kernel" >&2
            exit 1
          fi
          codex_drv=$(jq -er '.seeds[] | select(.artifact==14932607181) | .derivation' "$evidence/seed-import.json")
          if grep -Fq "building '$codex_drv'" "$evidence/native-install.log"; then
            echo "The installed fixture rebuilt its verified native Codex package" >&2
            exit 1
          fi
          for verified_seed in /nix/store/16gmg32v42wqdrchasslsbm5k2f1q5d4-ghc-9.10.3.drv /nix/store/iw0canvmhrpzn58csr6w7lq24qgny8kb-ghc-9.10.3.drv /nix/store/wjfz7sj4i49kc6gd06xsx5qlwjmqgb50-liblapack-3.12.1.drv /nix/store/l4qdc74lr2xgb7hdg1al47ahgdnvchqy-python3.13-mypy-1.20.1.drv; do
            if grep -Fq "building '$verified_seed'" "$evidence/native-install.log"; then
              echo "An independently verified native seed was rebuilt" >&2
              exit 1
            fi
          done
          test "$(wc -l < "$evidence/output-paths.txt")" -eq 1
          output=$(cat "$evidence/output-paths.txt")
          cp "$output/current-installed-offline-cli.json" "$evidence/installed-cli.json"
          jq -e --slurpfile plan "$evidence/evaluation.json" '.configuration==$plan[0].expectedProfile and .installed==$plan[0].installed and (.commands|length)==8 and all(.commands[]; .helpExit==0 and .helpCharacters>=20) and .networkInterfaces==["lo"] and (.networkRoutes|length)==0 and .controllingTerminal==false and .bootedFromInstalledExt4Disk and .installedFromOfflineSquashfs' "$evidence/installed-cli.json" > "$evidence/outcome-check.txt"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: d3d3605-native-arm-installed-headless-cli-seeded
          path: ${{ runner.temp }}/assbox-arm-installed-headless-cli/
          if-no-files-found: warn
          retention-days: 14
