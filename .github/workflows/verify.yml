        SYSTEMS:\\n        raise ValueError(\\\''Unknown kernel architecture\\\'')\\n    return \\\''kernel-\\\''
        + system + \\\''.json\\\''\\n\\n\\ndef validate_index(raw, *, release_sha, core, lock_sha, system,
        expected=None):\\n    value = decoded(raw)\\n    fields = {\\\''schema\\\'', \\\''kind\\\'', \\\''releaseManifestSha256\\\'',
        \\\''coreCommit\\\'', \\\''lockSha256\\\'', \\\''system\\\'',\\n              \\\''derivation\\\'',
        \\\''kernelVersion\\\'', \\\''outputs\\\'', \\\''publicKey\\\'', \\\''configSha256\\\'', \\\''closure\\\'',
        \\\''cacheAssets\\\''}\\n    if (not isinstance(value, dict) or set(value) != fields or encoded(value)
