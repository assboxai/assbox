# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox exact native ARM Chromium media recovery
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-current-chromium-media-recovery
  cancel-in-progress: false
jobs:
  seed:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-current-chromium-media-recovery' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        group: [media-ffmpeg, media-pipewire]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      INPUT_GROUP: ${{ matrix.group }}
      PRODUCT_COMMIT: d3d36054d98d1ccf3ab37853fd4c23b5621e72d5
      PRODUCT_TREE: ac7bc49124a59ad59bca1afde3d755dd88ec7370
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Download the verified compiler inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14911233205'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45358163413'
          path: ${{ runner.temp }}/assbox-arm-media-recovery-seeds/compiler
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified language inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14903986546'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45336837496'
          path: ${{ runner.temp }}/assbox-arm-media-recovery-seeds/language
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified platform-libraries inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14916138050'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45373207069'
          path: ${{ runner.temp }}/assbox-arm-media-recovery-seeds/platform-libraries
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified display-libraries inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14919506082'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45373207069'
          path: ${{ runner.temp }}/assbox-arm-media-recovery-seeds/display-libraries
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified runtime-core inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14923465085'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45360839334'
          path: ${{ runner.temp }}/assbox-arm-media-recovery-seeds/runtime-core
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified llvm-seed inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14790289191'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45085837980'
          path: ${{ runner.temp }}/assbox-arm-media-recovery-seeds/llvm-seed
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified python-tools inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14953102275'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45443784497'
          path: ${{ runner.temp }}/assbox-arm-media-recovery-seeds/python-tools
          skip-decompress: true
          digest-mismatch: error
      - name: Build exact native ARM Chromium media inputs and verify their signed cache
        timeout-minutes: 320
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C product rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          evidence="$RUNNER_TEMP/assbox-arm-chromium-seed-evidence"
          mkdir -m 0700 "$evidence"
          {
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git -C product rev-parse HEAD 'HEAD^{tree}'
            uname -sm
            nproc
            df -PB1 /nix/store "$RUNNER_TEMP"
            free -b
          } > "$evidence/scope.txt"
          monitor_resources() {
            while :; do
              date -u +%FT%TZ
              df -PB1 /nix/store "$RUNNER_TEMP"
              free -b
              sleep 60
            done
          }
          monitor_resources >> "$evidence/resources.log" &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          /usr/bin/python3 -I -B authority/.github/experiments/import-native-arm-media-recovery.py \
            "$PWD/product" "$RUNNER_TEMP/assbox-arm-media-recovery-seeds" "$evidence" "$INPUT_GROUP"
          /usr/bin/python3 -I -B authority/.github/experiments/native-arm-media-recovery.py "$PWD/product" "$evidence" "$INPUT_GROUP"
          if grep -Fq "building '/nix/store/sf1m5zznbj4ca5bgiamhdz4gzw8h0636-llvm-21.1.8.drv'" "$evidence/native-build.log" ||
             grep -Fq "building '/nix/store/l4qdc74lr2xgb7hdg1al47ahgdnvchqy-python3.13-mypy-1.20.1.drv'" "$evidence/native-build.log"; then
            echo "The build rebuilt a verified imported native input" >&2
            exit 1
          fi
          test -s "$evidence/index.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-native-arm-media-recovery-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/assbox-arm-chromium-seed-evidence/index.json
            ${{ runner.temp }}/assbox-arm-chromium-seed-evidence/signed-cache
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exact-native-arm-media-recovery-${{ matrix.group }}-diagnostics
          path: |
            ${{ runner.temp }}/assbox-arm-chromium-seed-evidence/expected.json
            ${{ runner.temp }}/assbox-arm-chromium-seed-evidence/native-build.log
            ${{ runner.temp }}/assbox-arm-chromium-seed-evidence/resources.log
            ${{ runner.temp }}/assbox-arm-chromium-seed-evidence/scope.txt
            ${{ runner.temp }}/assbox-arm-chromium-seed-evidence/signed-input-imports.json
          if-no-files-found: warn
          retention-days: 7
