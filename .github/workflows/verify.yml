        = index[\\\''publicKey\\\''].split(\\\'':\\\'')[0]\\n    for store_path, proof in index[\\\''closure\\\''].items():\\n        path
        = directory / (asset_prefix + store_path.split(\\\''/\\\'')[3].split(\\\''-\\\'')[0] + \\\''.narinfo\\\'')\\n        fields,
        signatures = {}, []\\n        for line in bounded(path, 256 * 1024).decode().splitlines():\\n            if
        \\\'': \\\'' in line:\\n                name, value = line.split(\\\'': \\\'', 1)\\n            elif
        line.endswith(\\\'':\\\''):\\n                name, value = line[:-1], \\\''\\\''\\n            else:\\n                raise
        ValueError(\\\''Invalid NAR metadata line\\\'')\\n            if name == \\\''Sig\\\'':\\n                signatures.append(value)\\n            elif
        name in fields:\\n                raise ValueError(\\\''Duplicate NAR metadata field\\\'')\\n            else:\\n                fields[name]
        = value\\n        required = {\\\''StorePath\\\'', \\\''URL\\\'', \\\''Compression\\\'', \\\''FileHash\\\'',
