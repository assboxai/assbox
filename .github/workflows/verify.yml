# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox development runner storage observation
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-development-runner-storage
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'assboxai/assbox' && github.ref == 'refs/heads/test-runner-storage' && github.event_name
      == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
        - system: x86_64-linux
          runner: ubuntu-24.04
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      ASSBOX_OBSERVE_SYSTEM: ${{ matrix.system }}
    steps:
    - name: Measure fixed preinstalled tool directories without changing the runner
      shell: bash
      run: "set -euo pipefail\n/usr/bin/python3 -I -B <<'ASSBOX_STORAGE_OBSERVATION'\nimport json,os,pathlib,platform,shutil,stat,subprocess\n\
        assert os.environ['GITHUB_REPOSITORY']=='assboxai/assbox'\nassert os.environ['GITHUB_REF']=='refs/heads/test-runner-storage'\n\
        assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'\nfacts=dict(schema=1,kind='assbox-development-runner-storage',source_commit=os.environ['GITHUB_SHA'],source_ref=os.environ['GITHUB_REF'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),system=os.environ['ASSBOX_OBSERVE_SYSTEM'],native_machine=platform.machine(),cpu_count=os.cpu_count(),volumes=[],directories=[],runner_changed=False)\n\
        assert facts['native_machine']==facts['system'].removesuffix('-linux')\nfor name in ('/', '/mnt',\
        \ os.environ['RUNNER_TEMP']):\n    p=pathlib.Path(name)\n    if p.exists():\n        usage=shutil.disk_usage(p)\n\
        \        facts['volumes'].append(dict(path=name,device=p.stat().st_dev,total_bytes=usage.total,available_bytes=usage.free))\n\
        for name in ('/usr/local/lib/android','/usr/share/dotnet','/opt/ghc','/opt/hostedtoolcache','/usr/local/.ghcup','/usr/local/swift','/usr/local/share/powershell','/usr/local/share/chromium','/usr/local/share/boost','/usr/local/share/vcpkg','/opt/google','/opt/microsoft','/var/lib/docker','/usr/lib/jvm'):\n\
        \    p=pathlib.Path(name)\n    item=dict(path=name,exists=p.exists(),symlink=p.is_symlink())\n\
        \    if p.exists() and not p.is_symlink():\n        try:\n            result=subprocess.run(['sudo','-n','/usr/bin/du','--summarize','--one-file-system','--block-size=1','--',name],capture_output=True,text=True,timeout=120\
        \ if name=='/usr/local/lib/android' else 30)\n            item['du_exit']=result.returncode\n\
        \            if result.returncode==0:\n                text=result.stdout.strip().split('\\t')\n\
        \                assert len(text)==2 and text[1]==name\n                item['allocated_bytes']=int(text[0])\n\
        \        except subprocess.TimeoutExpired:\n            item['du_timed_out']=True\n    facts['directories'].append(item)\n\
        output=pathlib.Path(os.environ['RUNNER_TEMP'])/'assbox-runner-storage.json'\noutput.write_text(json.dumps(facts,sort_keys=True,separators=(',',':'))+'\\\
        n')\nprint(json.dumps(facts,sort_keys=True))\nASSBOX_STORAGE_OBSERVATION\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: runner-storage-${{ matrix.system }}
        path: ${{ runner.temp }}/assbox-runner-storage.json
        if-no-files-found: error
        retention-days: 14
