# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox native ARM Nix checks
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-native-checks-v2
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-native-checks-v2' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PRODUCT_COMMIT: 44ecc35446c8688c8c79562524a9bc4d716852ad
      PRODUCT_TREE: 7c42b305a9831c5adf8ce851adccef21eea852d9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Verify the locked source and run the native Nix test phase
        shell: bash
        working-directory: product
        env:
          NIX_CONFIG: |
            max-jobs = 1
            cores = 2
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git -C ../authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C ../authority status --porcelain)"
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'ea86256a5c0755b5dc022ef446202ea28b404144a7a2eb2202199a58c3ec57b7  flake.lock' \
            'fe99c58c845e96a6d4c4e45d829a716d0b8fe3ca498eda5d62acca56803a0a09  scripts/release-check' \
            | sha256sum --check
          evidence="$RUNNER_TEMP/assbox-arm-native-checks"
          export XDG_STATE_HOME="$evidence/state"
          mkdir -m 0700 "$evidence" "$XDG_STATE_HOME"
          {
            date -u +%FT%TZ
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD 'HEAD^{tree}'
            sha256sum flake.lock scripts/release-check
            uname -sm
            df -h /nix/store "$RUNNER_TEMP"
            nix --version
            if test -r /dev/kvm && test -w /dev/kvm; then
              printf '%s\n' 'KVM device readable and writable by the runner'
            else
              printf '%s\n' 'KVM device unavailable to the runner'
            fi
          } | tee "$evidence/scope.txt"
          nix run path:./nix/dev#just -- setup --no-hooks
          set +e
          nix run path:./nix/dev#just -- verify-nix 2>&1 | tee "$evidence/verify-nix.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf 'verify_nix\t%s\nlog\t%s\n' "${pipeline_status[0]}" "${pipeline_status[1]}" > "$evidence/result.tsv"
          test -z "$(git status --porcelain)"
          if (( pipeline_status[0] != 0 )); then exit "${pipeline_status[0]}"; fi
          exit "${pipeline_status[1]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-arm-nix-checks
          path: |
            ${{ runner.temp }}/assbox-arm-native-checks/scope.txt
            ${{ runner.temp }}/assbox-arm-native-checks/result.tsv
            ${{ runner.temp }}/assbox-arm-native-checks/verify-nix.log
            ${{ runner.temp }}/assbox-verification/nix.jsonl
          if-no-files-found: warn
          retention-days: 14
