        result\\n    return json.loads(raw, object_pairs_hook=unique,\\n                      parse_constant=lambda
        _: (_ for _ in ()).throw(ValueError(\\\''Nonfinite metadata\\\'')))\\n\\n\\ndef bounded(path,
