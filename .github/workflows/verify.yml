        kernel cache digest\\\'')\\n    if (not isinstance(core, str) or not re.fullmatch(\\\''[0-9a-f]{40}\\\'',
        core)\\n            or not isinstance(value[\\\''derivation\\\''], str) or not re.fullmatch(STORE
