        = "$GITHUB_SHA"

        cp -- "$BUNDLE" "$RUNNER_TEMP/assbox-distribution-assets/release.sigstore.json"

        cp -- "$BUNDLE" "$RUNNER_TEMP/assbox-distribution-assets/kernel-x86_64-linux.sigstore.json"

        cp -- "$BUNDLE" "$RUNNER_TEMP/assbox-distribution-assets/kernel-aarch64-linux.sigstore.json"

        gh release create "$tag" "$RUNNER_TEMP/assbox-distribution-assets/"* --repo assboxai/assbox --target
        "$GITHUB_SHA" --prerelease --latest=false --title "Assbox release-bound kernel distribution qualification"
        --notes "Development experiment for three-subject Sigstore provenance and cold native kernel cache
        imports. Minimal development metadata; this is not a production release or full installation qualification."

