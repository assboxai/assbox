# SPDX-License-Identifier: GPL-3.0-or-later
# Manual ephemeral-runner regular-file compression probe; no Nix or VM.
name: Assbox native hosted storage probe
permissions: {}
concurrency:
  group: assbox-native-storage-v45
  cancel-in-progress: false
'on':
  workflow_dispatch: null
jobs:
  probe:
    if: github.repository == 'assboxai/assbox' && github.ref == 'refs/heads/test-native-storage-v45' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - system: x86_64-linux
          runner: ubuntu-24.04
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
    env:
      ASSBOX_CANDIDATE_SYSTEM: ${{ matrix.system }}
    steps:
    - name: Measure actual storage and validate compression in a disposable regular file
      shell: bash
      run: "set -euo pipefail\n/usr/bin/python3 -I -B <<'ASSBOX_FIXED_STORAGE_PROBE'\n\"\"\"Measure hosted\
        \ storage and test compression using only a private regular file.\n\nNo Nix installation, source\
        \ evaluation, VM, or host-device formatting occurs.\nThe fixed file-backed mount is removed in\
        \ finally; cleanup uncertainty is fatal.\n\"\"\"\nimport hashlib\nimport json\nimport os\nfrom\
        \ pathlib import Path\nimport platform\nimport re\nimport shutil\nimport stat\nimport subprocess\n\
        import tempfile\nimport time\n\nassert os.environ['GITHUB_ACTIONS'] == 'true' and os.environ['RUNNER_ENVIRONMENT']\
        \ == 'github-hosted'\nassert os.environ['GITHUB_REPOSITORY'] == 'assboxai/assbox'\nassert os.environ['GITHUB_REPOSITORY_ID']\
        \ == '1402455771'\nassert os.environ['GITHUB_REPOSITORY_OWNER_ID'] == '327835666'\nassert os.environ['GITHUB_EVENT_NAME']\
        \ == 'workflow_dispatch'\nassert os.environ['GITHUB_REF'] == 'refs/heads/test-native-storage-v45'\n\
        system = os.environ['ASSBOX_CANDIDATE_SYSTEM']\nassert system in ('x86_64-linux', 'aarch64-linux')\n\
        assert platform.system() == 'Linux' and platform.machine() == system.removesuffix('-linux')\n\
        temporary = Path(os.environ['RUNNER_TEMP'])\nassert temporary.is_absolute() and temporary.resolve()\
        \ == temporary\nassert temporary.is_dir() and temporary.stat().st_uid == os.getuid()\nenvironment\
        \ = {'PATH': '/usr/sbin:/usr/bin:/sbin:/bin', 'LANG': 'C.UTF-8',\n               'HOME': str(temporary),\
        \ 'GIT_CONFIG_NOSYSTEM': '1', 'GIT_CONFIG_GLOBAL': '/dev/null'}\n\n\ndef call(*arguments):\n \
        \   result = subprocess.run(arguments, env=environment, stdin=subprocess.DEVNULL,\n          \
        \                  capture_output=True, timeout=60)\n    assert result.returncode == 0, 'Storage\
        \ probe command failed: ' + Path(arguments[0]).name\n    return result.stdout.decode().strip()\n\
        \n\ndef capacity(path):\n    p = Path(path)\n    values = os.statvfs(p)\n    return dict(path=str(p),\
        \ device=p.stat().st_dev,\n                total_bytes=values.f_blocks * values.f_frsize,\n  \
        \              available_bytes=values.f_bavail * values.f_frsize,\n                filesystem=call('stat',\
        \ '-f', '--format=%T', str(p)))\n\n\nrecord = dict(schema=1, kind='ephemeral-hosted-file-backed-storage-probe',\
        \ system=system,\n              workflow_commit=os.environ['GITHUB_SHA'], run_id=int(os.environ['GITHUB_RUN_ID']),\n\
        \              run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), started_at=time.time(),\n  \
        \            capacities=[capacity(name) for name in ('/', '/mnt', str(temporary), '/var/tmp')\
        \ if Path(name).exists()],\n              tools={name: shutil.which(name, path=environment['PATH'])\
        \ for name in\n                     ('mkfs.btrfs', 'btrfs', 'mount', 'umount', 'findmnt')},\n\
        \              memory_bytes={line.split(':')[0]: int(line.split()[1]) * 1024\n               \
        \             for line in Path('/proc/meminfo').read_text().splitlines()\n                   \
        \         if line.split(':')[0] in ('MemTotal', 'MemAvailable', 'SwapTotal', 'SwapFree')},\n \
        \             nix_installed=False, vm_executed=False, full_gate_pass_claimed=False,\n        \
        \      physical_device_formatted=False, actual_exit=1, mount_cleanup_proven=False)\nstate = Path(tempfile.mkdtemp(prefix='assbox-storage-probe-',\
        \ dir=temporary))\nstate.chmod(0o700)\nimage = state / 'volume.btrfs'\nmountpoint = state / 'mounted'\n\
        mountpoint.mkdir(mode=0o700)\nmounted = False\ntry:\n    assert all(record['tools'].values()),\
        \ 'Required host Btrfs tools unavailable'\n    with image.open('xb') as output:\n        output.truncate(2\
        \ * 1024**3)\n    metadata = image.lstat()\n    assert stat.S_ISREG(metadata.st_mode) and metadata.st_uid\
        \ == os.getuid() and metadata.st_nlink == 1\n    # mkfs accepts a regular image directly. No /dev\
        \ path is ever formatted.\n    call('mkfs.btrfs', '--force', str(image))\n    call('sudo', '-n',\
        \ 'mount', '-t', 'btrfs', '-o', 'loop,compress-force=zstd:3', str(image), str(mountpoint))\n \
        \   mounted = True\n    call('sudo', '-n', 'chown', str(os.getuid()) + ':' + str(os.getgid()),\
        \ str(mountpoint))\n    mount = json.loads(call('findmnt', '--json', '--target', str(mountpoint),\
        \ '--output', 'TARGET,SOURCE,FSTYPE,OPTIONS'))['filesystems']\n    assert len(mount) == 1 and\
        \ mount[0]['target'] == str(mountpoint) and mount[0]['fstype'] == 'btrfs'\n    assert re.fullmatch(r'/dev/loop[0-9]+',\
        \ mount[0]['source'])\n    assert 'compress-force=zstd:3' in mount[0]['options'].split(',')\n\
        \    source = mountpoint / 'compressed-test'\n    block = b'assbox-public-compression-probe\\\
        n' * 32768\n    digest = hashlib.sha256()\n    total = 0\n    with source.open('xb') as output:\n\
        \        for _ in range(64):\n            output.write(block)\n            digest.update(block)\n\
        \            total += len(block)\n        output.flush()\n        os.fsync(output.fileno())\n\
        \    assert hashlib.sha256(source.read_bytes()).digest() == digest.digest()\n    call('sudo',\
        \ '-n', 'btrfs', 'filesystem', 'sync', str(mountpoint))\n    allocated = image.stat().st_blocks\
        \ * 512\n    record.update(compression_probe_input_bytes=total,\n                  compression_probe_image_allocated_bytes=allocated,\n\
        \                  compression_probe_roundtrip_sha256=digest.hexdigest(),\n                  compression_probe_passed=allocated\
        \ < total,\n                  virtual_volume_bytes=image.stat().st_size,\n                  underlying_capacity_after_probe=capacity(temporary),\n\
        \                  mount_filesystem='btrfs', mount_compression='zstd:3', file_backed=True)\n \
        \   assert record['compression_probe_passed'], 'Transparent compression did not reduce allocation'\n\
        \    record['actual_exit'] = 0\nexcept BaseException as error:\n    record.update(failure_type=type(error).__name__,\
        \ failure=str(error))\n    raise\nfinally:\n    if mounted:\n        cleanup = subprocess.run(['sudo',\
        \ '-n', 'umount', str(mountpoint)], env=environment,\n                                 stdin=subprocess.DEVNULL,\
        \ capture_output=True, timeout=60)\n        record['unmount_actual_exit'] = cleanup.returncode\n\
        \        record['mount_cleanup_proven'] = cleanup.returncode == 0\n    else:\n        record['mount_cleanup_proven']\
        \ = True\n    if record['mount_cleanup_proven']:\n        image.unlink(missing_ok=True)\n    \
        \    mountpoint.rmdir()\n        state.rmdir()\n    else:\n        record['actual_exit'] = 1\n\
        \    record.update(finished_at=time.time(), probe_file_removed=not image.exists())\n    print(json.dumps(record,\
        \ sort_keys=True))\nassert record['actual_exit'] == 0 and record['mount_cleanup_proven'] and record['probe_file_removed']\n\
        \nASSBOX_FIXED_STORAGE_PROBE\n"
