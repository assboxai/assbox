# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox current native ARM headless closure inventory
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-current-headless-inventory
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-current-headless-inventory' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 260
    permissions:
      actions: read
      contents: read
    env:
      PRODUCT_COMMIT: d3d36054d98d1ccf3ab37853fd4c23b5621e72d5
      PRODUCT_TREE: ac7bc49124a59ad59bca1afde3d755dd88ec7370
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Download the verified ARM llvm seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14790289191'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45085837980'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/llvm
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM nix-core seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14793257571'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45105620947'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/nix-core
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM rustc seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14796242324'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45113607681'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/rustc
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM clang seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14873761954'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45254317055'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/clang
          skip-decompress: true
          digest-mismatch: error
      - name: Download the verified ARM nix-module seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14813051401'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45127478115'
          path: ${{ runner.temp }}/assbox-installed-cli-seeds/nix-module
          skip-decompress: true
          digest-mismatch: error
      - name: Build and inventory the exact native ARM headless closure
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'ea86256a5c0755b5dc022ef446202ea28b404144a7a2eb2202199a58c3ec57b7  flake.lock' \
            '10e9eb6ad0cc12447dbea4fd76160c1b8a14ba1bdaa3e5ff0eadc1ae218b4997  scripts/release-check' \
            | sha256sum --check
          evidence="$RUNNER_TEMP/assbox-arm-headless-inventory"
          mkdir -m 0700 "$evidence"
          {
            date -u +%FT%TZ
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD 'HEAD^{tree}'
            sha256sum flake.lock scripts/release-check
            uname -sm
            df -h /nix/store "$RUNNER_TEMP"
            nix --version
          } > "$evidence/scope.txt"
          nix eval --json --no-update-lock-file --no-write-lock-file \
            '.#nixosConfigurations.aarch64-linux-uefi-none-headless.config.system.build.toplevel' \
            --apply 'toplevel: { test = toplevel.drvPath; installed = toplevel.outPath; expectedProfile = { system = toplevel.system; }; }' > "$evidence/evaluation.json"
          drv=$(jq -er '.test' "$evidence/evaluation.json")
          test "$drv" = '/nix/store/3y3vjfl9hn5cyly4jpk24lgagcfch43i-nixos-system-assbox-ci-26.05.20261007.2efa67f.drv'
          test "$(jq -er '.installed' "$evidence/evaluation.json")" = '/nix/store/06b6kkgcx9bp7pa65z852ipc9il4hyz8-nixos-system-assbox-ci-26.05.20261007.2efa67f'
          /usr/bin/python3 -I -B ../authority/.github/experiments/import-arm-installed-cli-seeds.py \
            "$PWD" "$RUNNER_TEMP/assbox-installed-cli-seeds" "$evidence"
          /usr/bin/python3 -I -B ../authority/.github/experiments/import-arm-installed-kernel.py "$PWD" "$evidence"
          status=0
          nix build --no-link --print-out-paths --max-jobs 2 --cores 2 -L "$drv^out" > "$evidence/output-paths.txt" 2> "$evidence/native-build.log" || status=$?
          printf '%s\n' "$status" > "$evidence/status.exit"
          if test "$status" -ne 0; then
            tail -40 "$evidence/native-build.log" >&2
            exit "$status"
          fi
          test "$(cat "$evidence/output-paths.txt")" = "$(jq -er '.installed' "$evidence/evaluation.json")"
          kernel_drv=$(jq -er '.derivation' "$evidence/kernel-import.json")
          if grep -Fq "building '$kernel_drv'" "$evidence/native-build.log"; then
            echo "The native headless closure rebuilt the verified prerequisite kernel" >&2
            exit 1
          fi
          nix path-info --recursive --json --json-format 1 "$(cat "$evidence/output-paths.txt")" > "$evidence/closure.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: current-native-arm-headless-inventory
          path: ${{ runner.temp }}/assbox-arm-headless-inventory/
          if-no-files-found: warn
          retention-days: 14
