# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox exact current native ARM independent profiles
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-current-independent-profile-inventories
  cancel-in-progress: false
jobs:
  seed:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-current-independent-profile-inventories' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        group: [cli-components, service-components, editor-components, workers-and-gateways, desktop-profiles]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      INPUT_GROUP: ${{ matrix.group }}
      PRODUCT_COMMIT: d3d36054d98d1ccf3ab37853fd4c23b5621e72d5
      PRODUCT_TREE: ac7bc49124a59ad59bca1afde3d755dd88ec7370
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Realize exact native profile roots and retain raw advisory evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$(uname -m)" = aarch64
          evidence="$RUNNER_TEMP/assbox-native-profile-evidence"
          mkdir -m 0700 "$evidence"
          df -PB1 /nix/store "$RUNNER_TEMP" > "$evidence/resource.txt"
          free -b >> "$evidence/resource.txt"
          /usr/bin/python3 -I -B authority/.github/experiments/current-arm-independent-profiles.py evaluate "$PWD/product" "$evidence"
          /usr/bin/python3 -I -B authority/.github/experiments/import-verified-arm-profile-kernel.py "$PWD/product" "$evidence"
          /usr/bin/python3 -I -B authority/.github/experiments/current-arm-independent-profiles.py realize "$PWD/product" "$evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-arm-independent-profiles-${{ matrix.group }}
          path: ${{ runner.temp }}/assbox-native-profile-evidence/
          retention-days: 14
          if-no-files-found: error
