# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox x86 live checkpoint qualification
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-physical-checkpoint-x86-v11
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/physical-checkpoint-x86-v11' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9df40f0d019211de6d7d161b4cf64c32327e3ccf
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Import only the verified signed development kernel and formatter
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          install -d -m 0700 "$RUNNER_TEMP/assbox-checkpoint-logs"
          /usr/bin/python3 -I -B authority/.github/experiments/prefill-checkpoint-distribution.py \
            product "$RUNNER_TEMP/assbox-checkpoint-logs/kernel-formatter-seed.json"
      - name: Download verified sqlite package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14802903280'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45140156638'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/sqlite
          skip-decompress: true
      - name: Download verified codex package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14806420068'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45140156638'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/codex
          skip-decompress: true
      - name: Download verified toolchain package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14808045620'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45140156638'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/toolchain
          skip-decompress: true
      - name: Download verified bootloader package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14812096158'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45140156638'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/bootloader
          skip-decompress: true
      - name: Download verified live-systemd package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14813159793'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45140156638'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/live-systemd
          skip-decompress: true
      - name: Download verified build-support package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14816571539'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45140156638'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/build-support
          skip-decompress: true
      - name: Download verified llvm-native package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14864676325'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45235413783'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/llvm-native
          skip-decompress: true
      - name: Download verified node-runtime package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14862303389'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45235413783'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/node-runtime
          skip-decompress: true
      - name: Download verified rust-bootstrap package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14854496288'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45235413783'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/rust-bootstrap
          skip-decompress: true
      - name: Download verified rust-compiler package cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14872068130'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45270851454'
          path: ${{ runner.temp }}/assbox-checkpoint-package-seeds/rust-compiler
          skip-decompress: true
      - name: Import only the independently verified signed native package caches
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/import-checkpoint-package-seeds.py \
            product "$RUNNER_TEMP/assbox-checkpoint-package-seeds" "$RUNNER_TEMP/assbox-checkpoint-logs/package-seeds.json"
      - name: Verify native finite gates and boot the exact hybrid image twice
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/physical-checkpoint.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-x86-live-checkpoint
          path: ${{ runner.temp }}/assbox-checkpoint-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: x86-checkpoint-diagnostics
          path: ${{ runner.temp }}/assbox-checkpoint-logs/
          if-no-files-found: warn
          retention-days: 14
  attest:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/physical-checkpoint-x86-v11' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: exact-x86-live-checkpoint
          path: ${{ runner.temp }}/assbox-checkpoint-assets/
      - name: Verify exact ISO and both boot observations before attestation
        run: /usr/bin/python3 -I -B authority/.github/experiments/physical-checkpoint.py validate
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        id: attest
        with:
          subject-path: |
            ${{ runner.temp }}/assbox-checkpoint-assets/assbox-physical-checkpoint.json
            ${{ runner.temp }}/assbox-checkpoint-assets/assbox-physical-checkpoint-x86_64-linux.iso
      - name: Retain the build provenance bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          install -m 0600 -- "$BUNDLE" "$RUNNER_TEMP/assbox-physical-checkpoint.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: attested-x86-live-checkpoint-provenance
          path: ${{ runner.temp }}/assbox-physical-checkpoint.sigstore.json
          if-no-files-found: error
          retention-days: 14
