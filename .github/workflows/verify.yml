# SPDX-License-Identifier: GPL-3.0-or-later
name: Assbox native ARM candidate gates and bounded closure collection
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: assbox-arm-closure-audit-v14
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/arm-closure-admin-session-bound' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      PRODUCT_COMMIT: 72faa6e92877a1098e5ce4e09e101b6bd78b5861
      PRODUCT_TREE: 8a13432ee579273be10a297c6d8078c67ebe15b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: product
          persist-credentials: false
      - name: Clear unused SDKs on the ephemeral hosted runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP
          /usr/bin/python3 -I -B authority/scripts/clear_unused_runner_tools.py
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Remove installer credentials before candidate execution
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -I -B authority/scripts/clear_nix_credentials.py
          sudo systemctl restart nix-daemon.service
          nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)["access-tokens"]["value"] == {}, "Nix API credentials remain configured"'
      - name: Verify candidate identity and run native finite gates
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C authority status --porcelain)"
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'ea86256a5c0755b5dc022ef446202ea28b404144a7a2eb2202199a58c3ec57b7  flake.lock' \
            '10e9eb6ad0cc12447dbea4fd76160c1b8a14ba1bdaa3e5ff0eadc1ae218b4997  scripts/release-check' \
            | sha256sum --check
          evidence="$RUNNER_TEMP/assbox-arm-closure-audit"
          mkdir -m 0700 "$evidence"
          {
            date -u +%FT%TZ
            printf 'workflowCommit\t%s\nrunId\t%s\nrunAttempt\t%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD 'HEAD^{tree}'
            sha256sum flake.lock scripts/release-check
            uname -sm
            df -h /nix/store "$RUNNER_TEMP"
            nix --version
          } > "$evidence/scope.txt"
          export XDG_STATE_HOME="$RUNNER_TEMP/assbox-arm-chainman-state"
          mkdir -m 0700 "$XDG_STATE_HOME"
          run_finite() {
            local command_name=$1
            local result=0
            nix run path:./nix/dev#just -- "$@" > "$evidence/finite-$command_name.log" 2>&1 || result=$?
            printf '%s\t%s\t%s\n' "$command_name" "$result" "$(date -u +%FT%TZ)" >> "$evidence/finite.tsv"
            return "$result"
          }
          run_finite setup --no-hooks
          run_finite doctor
          run_finite explain verify --json
          run_finite deps-check
          run_finite deps-coverage
          run_finite deps-policy-report
          run_finite verify-lite
          run_finite verify-prepare
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-arm-finite-before-closure
          path: |
            ${{ runner.temp }}/assbox-arm-closure-audit/scope.txt
            ${{ runner.temp }}/assbox-arm-closure-audit/finite.tsv
            ${{ runner.temp }}/assbox-arm-closure-audit/finite-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Prefill exact ARM kernel and formatter from the signed development cache
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/prefill-arm-distribution.py \
            product "$RUNNER_TEMP/assbox-arm-closure-audit/kernel-formatter-seed.json"
      - name: Download the verified ARM nix seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14813051401'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45127478115'
          path: ${{ runner.temp }}/assbox-arm-nix-seed-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and import the exact signed ARM nix seed
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/import-arm-nix-seed.py \
            product "$RUNNER_TEMP/assbox-arm-nix-seed-download" \
            "$RUNNER_TEMP/assbox-arm-closure-audit/nix-seed.json"
      - name: Download the verified ARM llvm seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14790289191'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45085837980'
          path: ${{ runner.temp }}/assbox-arm-llvm-seed-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and import the exact signed ARM llvm seed
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/import-arm-llvm-seed.py \
            product "$RUNNER_TEMP/assbox-arm-llvm-seed-download" \
            "$RUNNER_TEMP/assbox-arm-closure-audit/llvm-seed.json"
      - name: Download the verified ARM rustc seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14796242324'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45113607681'
          path: ${{ runner.temp }}/assbox-arm-rustc-seed-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and import the exact signed ARM rustc seed
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/import-arm-rustc-seed.py \
            product "$RUNNER_TEMP/assbox-arm-rustc-seed-download" \
            "$RUNNER_TEMP/assbox-arm-closure-audit/rustc-seed.json"
      - name: Download the verified ARM chromium-rustc seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14795754390'
          github-token: ${{ github.token }}
          repository: assboxai/assbox
          run-id: '45113628269'
          path: ${{ runner.temp }}/assbox-arm-chromium-rustc-seed-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and import the exact signed ARM chromium-rustc seed
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B authority/.github/experiments/import-arm-chromium-rustc-seed.py \
            product "$RUNNER_TEMP/assbox-arm-chromium-rustc-seed-download" \
            "$RUNNER_TEMP/assbox-arm-closure-audit/chromium-rustc-seed.json"
      - name: Collect the exact native closure inventory with bounded parallelism
        working-directory: product
        shell: bash
        env:
          NIX_CONFIG: |
            max-jobs = 2
            cores = 2
        run: |
          set -euo pipefail
          umask 077
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          evidence="$RUNNER_TEMP/assbox-arm-closure-audit"
          nix config show --json | python3 -I -B -c '
          import json, sys
          settings=json.load(sys.stdin)
          assert settings["max-jobs"]["value"] == 2 and settings["cores"]["value"] == 2
          print("Nix build parallelism verified")'
          record_resources() {
            date -u +%FT%TZ
            df -PB1 /nix/store "$RUNNER_TEMP"
            free -b
          }
          record_resources | tee "$evidence/resource-at-start.txt"
          (while sleep 60; do record_resources; done) &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true
                wait "$resource_monitor" 2>/dev/null || true' EXIT
          status=0
          nix develop .#release-check --no-update-lock-file --no-write-lock-file \
            --command bash "$GITHUB_WORKSPACE/authority/.github/experiments/collect-closures.sh" "$evidence" \
            > "$evidence/collection.log" 2>&1 || status=$?
          printf '%s\t%s\n' "$status" "$(date -u +%FT%TZ)" > "$evidence/collection-exit.tsv"
          record_resources > "$evidence/resource-at-exit.txt"
          if test "$status" = 0; then
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/authority/.github/experiments/verify-arm-root-map.py" \
              "$GITHUB_WORKSPACE/authority/.github/experiments/arm-closure-expected.json" "$evidence"
          fi
          if test -f "$evidence/cache/Data.fs"; then
            sha256sum "$evidence/cache/Data.fs" > "$evidence/vulnix-data-sha256.txt"
          fi
          test -z "$(git status --porcelain)"
          exit "$status"
      - name: Encrypt the report and collection evidence for the owner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/assbox-arm-closure-audit"
          if ! test -d "$evidence"; then exit 0; fi
          keyring=$(mktemp -d "$RUNNER_TEMP/assbox-arm-gpg.XXXXXXXX")
          gpg --batch --homedir "$keyring" --import authority/.github/experiments/arm-audit-recipient.asc
          fingerprint=$(gpg --batch --homedir "$keyring" --with-colons --list-keys | awk -F: '$1 == "fpr" && !found { print $10; found=1 }')
          test "$fingerprint" = 599CB031260C404BC8A94AE5F50F23A3C788889D
          tar --exclude='./cache' -cf - -C "$evidence" . | gpg --batch --homedir "$keyring" --trust-model always \
            --recipient "$fingerprint" --output "$RUNNER_TEMP/assbox-arm-closure-audit.tar.gpg" --encrypt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-native-arm-closure-audit
          path: ${{ runner.temp }}/assbox-arm-closure-audit.tar.gpg
          if-no-files-found: warn
          retention-days: 14
