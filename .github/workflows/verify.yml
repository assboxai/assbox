name: Assbox native ARM KVM capability
'on':
  workflow_dispatch: null
permissions: {}
jobs:
  probe:
    if: >-
      github.repository == 'assboxai/assbox' &&
      github.repository_id == '1402455771' &&
      github.repository_owner_id == '327835666' &&
      github.ref == 'refs/heads/test/native-arm-kvm-capability-v1' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PRODUCT_COMMIT: 9841fd45363aebff7a185245114ac786bab0a9e9
      PRODUCT_TREE: 30f0e42c815ee3d50db7e4471e0060f6d8259b9e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
      - name: Check whether the runner can create a native KVM guest
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -sm)" = 'Linux aarch64'
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          /usr/bin/python3 -I -B - <<'PYTHON' > "$RUNNER_TEMP/arm-kvm-capability.json"
          from datetime import datetime, timezone
          import errno
          import fcntl
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess

          def examine():
              probe = {'exists': False, 'characterDevice': False, 'apiVersion': None, 'createVm': False}
              try:
                  info = Path('/dev/kvm').stat()
                  probe.update(exists=True, characterDevice=stat.S_ISCHR(info.st_mode))
                  if not probe['characterDevice']:
                      return {**probe, 'error': 'not_character_device'}
                  fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
                  try:
                      probe['apiVersion'] = fcntl.ioctl(fd, 0xAE00, 0)
                      if probe['apiVersion'] == 12:
                          vm = fcntl.ioctl(fd, 0xAE01, 0)
                          os.close(vm)
                          probe['createVm'] = True
                  finally:
                      os.close(fd)
              except OSError as error:
                  probe['error'] = errno.errorcode.get(error.errno, str(error.errno))
              return probe

          result = examine()
          print(json.dumps({
              'architecture': os.uname().machine, 'kernel': os.uname().release,
              'virtualization': subprocess.run(['/usr/bin/systemd-detect-virt'], text=True, capture_output=True).stdout.strip(),
              'workflow': os.environ['GITHUB_SHA'], 'run': int(os.environ['GITHUB_RUN_ID']),
              'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source': os.environ['PRODUCT_COMMIT'], 'tree': os.environ['PRODUCT_TREE'],
              'unprivileged': result, 'observedAt': datetime.now(timezone.utc).isoformat(),
          }, sort_keys=True))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-native-arm-kvm-capability
          path: ${{ runner.temp }}/arm-kvm-capability.json
          if-no-files-found: error
          retention-days: 14
