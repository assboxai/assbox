        isinstance(info, dict) and set(info) == set(paths) and all(isinstance(proof, dict) for proof in
        info.values())\\n\\n\\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\\n    def redirect_request(self,
        *args, **kwargs):\\n        return None\\n\\n\\ndef download(tag, asset, destination, limit):\\n    if
