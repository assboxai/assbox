# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify locked source
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          enable_kvm: ${{ matrix.system == 'x86_64-linux' }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Require committed input lock
        run: test -f flake.lock && git ls-files --error-unmatch flake.lock
      - name: Static checks and tooling tests
        run: python3 scripts/verify_observed.py static
      - name: Native Rust checks
        run: python3 scripts/verify_observed.py rust
      - name: Guard-removal mutations
        run: python3 scripts/verify_observed.py mutations
      - name: Nix evaluation, system builds and disposable VMs
        run: python3 scripts/verify_observed.py nix
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-${{ matrix.system }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assbox-verification
          if-no-files-found: warn
          retention-days: 14
