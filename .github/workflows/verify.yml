# SPDX-License-Identifier: GPL-3.0-or-later
# Original source/assertions/hardware/budgets; extra private failure observation only.
name: Assbox original native ARM installation diagnostics
permissions:
  contents: read
concurrency:
  group: assbox-native-arm-install-diagnostics-v45
  cancel-in-progress: false
'on':
  workflow_dispatch: null
jobs:
  diagnose:
    if: github.repository == 'assboxai/assbox' && github.ref == 'refs/heads/test-native-arm-install-diagnostics-v45'
      && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
        - system: aarch64-linux
          runner: ubuntu-24.04-arm
          case: uefi-512
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    env:
      ASSBOX_CANDIDATE_SYSTEM: ${{ matrix.system }}
      ASSBOX_INSTALL_CASE: ${{ matrix.case }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: assboxai/assbox
        ref: 4e4362b7f27c0898589f4898684c8d627598cfa9
        path: product
        persist-credentials: false
    - name: Clear unused SDKs on the ephemeral hosted runner
      run: "sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP\
        \ /usr/bin/python3 -I -B <<'ASSBOX_RUNNER_CLEARANCE'\n#!/usr/bin/env python3\n# SPDX-License-Identifier:\
        \ GPL-3.0-or-later\n\"\"\"Reclaim fixed unused SDK directories on an ephemeral GitHub-hosted Linux\
        \ runner.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport re\n\
        import shutil\nimport stat\nimport time\n\nPATHS = tuple(Path(name) for name in (\n    '/usr/local/lib/android',\
        \ '/usr/share/dotnet',\n    '/opt/hostedtoolcache', '/usr/local/.ghcup'))\n\n\ndef validate_environment(environment):\n\
        \    if (os.geteuid() != 0 or platform.system() != 'Linux'\n            or environment.get('GITHUB_ACTIONS')\
        \ != 'true'\n            or environment.get('RUNNER_ENVIRONMENT') != 'github-hosted'\n       \
        \     or environment.get('GITHUB_EVENT_NAME') not in (\n                'workflow_dispatch', 'schedule',\
        \ 'push', 'pull_request', 'workflow_run', 'workflow_call')):\n        raise ValueError('Clearance\
        \ requires an ephemeral hosted Linux workflow runner')\n    if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',\
        \ environment.get('GITHUB_REPOSITORY', '')):\n        raise ValueError('Missing workflow repository\
        \ identity')\n    for name in ('GITHUB_REPOSITORY_ID', 'GITHUB_REPOSITORY_OWNER_ID', 'GITHUB_RUN_ID',\
        \ 'GITHUB_RUN_ATTEMPT'):\n        if not re.fullmatch(r'[1-9][0-9]*', environment.get(name, '')):\n\
        \            raise ValueError('Missing numeric workflow identity')\n    if not re.fullmatch(r'[0-9a-f]{40}',\
        \ environment.get('GITHUB_SHA', '')):\n        raise ValueError('Missing workflow source identity')\n\
        \    temporary = Path(environment.get('RUNNER_TEMP', ''))\n    if not temporary.is_absolute()\
        \ or temporary.resolve() != temporary:\n        raise ValueError('Unexpected runner temporary\
        \ path')\n    metadata = temporary.lstat()\n    if not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid\
        \ == 0:\n        raise ValueError('Unexpected runner temporary ownership')\n    return temporary,\
        \ metadata.st_uid\n\n\ndef mount_points():\n    points = []\n    for line in Path('/proc/self/mountinfo').read_text().splitlines():\n\
        \        value = line.split()[4]\n        value = re.sub(r'\\\\([0-7]{3})', lambda match: chr(int(match[1],\
        \ 8)), value)\n        points.append(Path(value))\n    return points\n\n\ndef clear_directories(paths,\
        \ runner_uid, root_device, mounts):\n    if not shutil.rmtree.avoids_symlink_attacks:\n      \
        \  raise ValueError('Symlink-resistant directory deletion is required')\n    admitted = []\n \
        \   for path in paths:\n        if path.is_symlink() or path.resolve() != path:\n            raise\
        \ ValueError('Refusing a redirected toolchain directory')\n        if not path.exists():\n   \
        \         continue\n        metadata = path.lstat()\n        if (not stat.S_ISDIR(metadata.st_mode)\
        \ or metadata.st_uid not in (0, runner_uid)\n                or metadata.st_dev != root_device):\n\
        \            raise ValueError('Unexpected toolchain directory type, owner or volume')\n      \
        \  if any(mount == path or path in mount.parents for mount in mounts):\n            raise ValueError('Refusing\
        \ a mounted toolchain directory')\n        admitted.append(path)\n    # Admit the entire fixed\
        \ set before removing anything.\n    for path in admitted:\n        shutil.rmtree(path)\n    \
        \    if path.exists():\n            raise ValueError('Toolchain clearance was incomplete')\n \
        \   return [str(path) for path in admitted]\n\n\ndef main():\n    temporary, runner_uid = validate_environment(os.environ)\n\
        \    before = shutil.disk_usage('/')\n    started = time.monotonic()\n    removed = clear_directories(PATHS,\
        \ runner_uid, Path('/').stat().st_dev, mount_points())\n    after = shutil.disk_usage('/')\n \
        \   facts = dict(schema=1, kind='hosted-runner-toolchain-clearance',\n                 system=platform.machine()\
        \ + '-linux', source_commit=os.environ['GITHUB_SHA'],\n                 run_id=int(os.environ['GITHUB_RUN_ID']),\
        \ run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),\n                 removed_directories=removed,\
        \ before_available_bytes=before.free,\n                 after_available_bytes=after.free, observed_free_bytes_increase=after.free\
        \ - before.free,\n                 seconds=round(time.monotonic() - started, 2))\n    output =\
        \ temporary / 'assbox-runner-clearance.json'\n    fd = os.open(output, os.O_WRONLY | os.O_CREAT\
        \ | os.O_EXCL | os.O_NOFOLLOW, 0o644)\n    with os.fdopen(fd, 'w') as stream:\n        stream.write(json.dumps(facts,\
        \ sort_keys=True, separators=(',', ':')) + '\\n')\n    print(json.dumps(facts, sort_keys=True))\n\
        \n\nif __name__ == '__main__':\n    main()\nASSBOX_RUNNER_CLEARANCE"
    - name: Prepare a bounded compressed regular-file Nix and builder volume
      shell: bash
      run: "set -euo pipefail\n/usr/bin/python3 -I -B <<'ASSBOX_FIXED_COMPRESSED_STORAGE'\n\"\"\"Create\
        \ a compressed Nix/build volume from one new regular file on hosted CI.\n\nThe virtual volume\
        \ is smaller than currently available underlying storage, with\n16 GiB reserved for runner logs/source/state.\
        \ It cannot invent extra capacity.\nNo physical device is formatted. This volume lasts for this\
        \ ephemeral job only.\n\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport platform\n\
        import re\nimport shutil\nimport stat\nimport subprocess\nimport time\n\nassert os.geteuid() !=\
        \ 0\nassert os.environ['GITHUB_ACTIONS'] == 'true' and os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'\n\
        assert os.environ['GITHUB_REPOSITORY'] == 'assboxai/assbox'\nassert os.environ['GITHUB_REPOSITORY_ID']\
        \ == '1402455771'\nassert os.environ['GITHUB_REPOSITORY_OWNER_ID'] == '327835666'\nassert os.environ['GITHUB_EVENT_NAME']\
        \ == 'workflow_dispatch'\nassert os.environ['GITHUB_REF'] == 'refs/heads/test-native-arm-install-diagnostics-v45'\n\
        system = os.environ['ASSBOX_CANDIDATE_SYSTEM']\nassert system in ('x86_64-linux', 'aarch64-linux')\n\
        assert platform.system() == 'Linux' and platform.machine() == system.removesuffix('-linux')\n\
        temporary = Path(os.environ['RUNNER_TEMP'])\nassert temporary.is_absolute() and temporary.resolve()\
        \ == temporary\nassert temporary.is_dir() and temporary.stat().st_uid == os.getuid()\nenvironment\
        \ = {'PATH': '/usr/sbin:/usr/bin:/sbin:/bin', 'LANG': 'C.UTF-8', 'HOME': str(temporary)}\nfor\
        \ name in ('mkfs.btrfs', 'mount', 'findmnt', 'sudo'):\n    assert shutil.which(name, path=environment['PATH']),\
        \ 'Required volume tool unavailable: ' + name\nmountpoint = Path('/nix')\nassert not mountpoint.exists()\
        \ and not mountpoint.is_symlink(), 'Refuse to hide or replace an existing Nix installation'\n\
        state = temporary / 'assbox-compressed-nix-volume'\nstate.mkdir(mode=0o700)\nimage = state / 'volume.btrfs'\n\
        underlying = os.statvfs(state)\navailable = underlying.f_bavail * underlying.f_frsize\nreserve\
        \ = 16 * 1024**3\nvolume_bytes = ((available - reserve) // 1024**3) * 1024**3\nassert 64 * 1024**3\
        \ <= volume_bytes <= available - reserve\nassert volume_bytes <= 160 * 1024**3\nrecord = dict(schema=1,\
        \ kind='ephemeral-compressed-file-backed-nix-volume', system=system,\n              run_id=int(os.environ['GITHUB_RUN_ID']),\
        \ run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),\n              workflow_commit=os.environ['GITHUB_SHA'],\
        \ started_at=time.time(),\n              backing_file=str(image), underlying_device=state.stat().st_dev,\n\
        \              underlying_available_bytes_before=available, reserved_underlying_bytes=reserve,\n\
        \              virtual_volume_bytes=volume_bytes, physical_device_formatted=False,\n         \
        \     vm_executed=False, full_gate_pass_claimed=False, actual_exit=1,\n              cleanup='Retained\
        \ for the ephemeral job lifetime; runner teardown not independently observed')\n\n\ndef call(*arguments):\n\
        \    result = subprocess.run(arguments, env=environment, stdin=subprocess.DEVNULL,\n         \
        \                   capture_output=True, timeout=60)\n    assert result.returncode == 0, 'Volume\
        \ command failed: ' + Path(arguments[0]).name\n    return result.stdout.decode().strip()\n\n\n\
        try:\n    with image.open('xb') as output:\n        output.truncate(volume_bytes)\n    image.chmod(0o600)\n\
        \    metadata = image.lstat()\n    assert stat.S_ISREG(metadata.st_mode) and metadata.st_uid ==\
        \ os.getuid() and metadata.st_nlink == 1\n    call('mkfs.btrfs', '--force', str(image))\n    call('sudo',\
        \ '-n', 'mkdir', '--mode=0755', str(mountpoint))\n    call('sudo', '-n', 'mount', '-t', 'btrfs',\
        \ '-o', 'loop,compress-force=zstd:3', str(image), str(mountpoint))\n    mounted = json.loads(call('findmnt',\
        \ '--json', '--target', str(mountpoint), '--output', 'TARGET,SOURCE,FSTYPE,OPTIONS'))['filesystems']\n\
        \    assert len(mounted) == 1 and mounted[0]['target'] == '/nix' and mounted[0]['fstype'] == 'btrfs'\n\
        \    assert re.fullmatch(r'/dev/loop[0-9]+', mounted[0]['source'])\n    assert 'compress-force=zstd:3'\
        \ in mounted[0]['options'].split(',')\n    assert mountpoint.stat().st_dev != state.stat().st_dev\n\
        \    call('sudo', '-n', 'mkdir', '--mode=0755', '/nix/assbox-build')\n    call('sudo', '-n', 'mkdir',\
        \ '--mode=0700', '/nix/assbox-diagnostic-state')\n    call('sudo', '-n', 'chown', str(os.getuid())\
        \ + ':' + str(os.getgid()), '/nix/assbox-diagnostic-state')\n    capacity = os.statvfs(mountpoint)\n\
        \    record.update(actual_exit=0, compression='zstd:3', mountpoint='/nix',\n                 \
        \ build_directory='/nix/assbox-build', mounted_device=mountpoint.stat().st_dev,\n            \
        \      observed_volume_total_bytes=capacity.f_blocks * capacity.f_frsize,\n                  observed_volume_available_bytes=capacity.f_bavail\
        \ * capacity.f_frsize,\n                  backing_allocated_bytes_after_setup=image.stat().st_blocks\
        \ * 512)\nexcept BaseException as error:\n    record.update(failure_type=type(error).__name__,\
        \ failure=str(error),\n                  cleanup='Setup failed; private backing state retained\
        \ without assuming mount cleanup')\n    raise\nfinally:\n    record['finished_at'] = time.time()\n\
        \    (temporary / 'assbox-compressed-nix-volume.json').write_text(json.dumps(record, sort_keys=True)\
        \ + '\\n')\n    print(json.dumps(record, sort_keys=True))\nassert record['actual_exit'] == 0\n\
        \nASSBOX_FIXED_COMPRESSED_STORAGE\n"
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
        enable_kvm: ${{ matrix.system == 'x86_64-linux' }}
        extra_nix_config: 'experimental-features = nix-command flakes

          accept-flake-config = false

          max-jobs = 1

          build-dir = /nix/assbox-build

          '
    - name: Remove installer credentials before candidate execution
      run: "sudo /usr/bin/python3 -I -B <<'ASSBOX_CLEAR_NIX_CREDENTIALS'\n#!/usr/bin/env python3\n# SPDX-License-Identifier:\
        \ GPL-3.0-or-later\n\"\"\"Remove the installer's persisted API credentials before candidate execution.\"\
        \"\"\nimport os\nfrom pathlib import Path\nimport re\nimport stat\nimport tempfile\n\nMAX_CONFIG\
        \ = 256 * 1024\n\n\ndef sanitized(contents):\n    if len(contents) > MAX_CONFIG:\n        raise\
        \ ValueError('Nix configuration exceeds the cleanup bound')\n    lines = contents.decode('utf-8').splitlines(keepends=True)\n\
        \    result = []\n    continuation = False\n    for line in lines:\n        if re.match(r'^\\\
        s*!?include\\s+', line):\n            raise ValueError('Indirect Nix configuration requires separate\
        \ cleanup review')\n        credential = re.match(r'^\\s*(?:extra-)?access-tokens\\s*=', line)\n\
        \        if credential or continuation:\n            continuation = line.rstrip().endswith('\\\
        \\')\n            continue\n        result.append(line)\n    return (''.join(result).rstrip('\\\
        n') + '\\naccess-tokens =\\n').encode('utf-8')\n\n\ndef rewrite(path, owner):\n    path = Path(path)\n\
        \    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\n    with os.fdopen(fd, 'rb') as stream:\n\
        \        metadata = os.fstat(stream.fileno())\n        if (not stat.S_ISREG(metadata.st_mode)\
        \ or metadata.st_nlink != 1\n                or metadata.st_uid != owner):\n            raise\
        \ ValueError('Unexpected Nix configuration ownership or file type')\n        contents = sanitized(stream.read(MAX_CONFIG\
        \ + 1))\n    temporary_fd, temporary = tempfile.mkstemp(prefix='.assbox-nix-', dir=path.parent)\n\
        \    try:\n        with os.fdopen(temporary_fd, 'wb') as stream:\n            os.fchmod(stream.fileno(),\
        \ stat.S_IMODE(metadata.st_mode))\n            os.fchown(stream.fileno(), metadata.st_uid, metadata.st_gid)\n\
        \            stream.write(contents)\n            stream.flush()\n            os.fsync(stream.fileno())\n\
        \        os.replace(temporary, path)\n    finally:\n        if os.path.exists(temporary):\n  \
        \          os.unlink(temporary)\n\n\nif __name__ == '__main__':\n    if os.geteuid() != 0:\n \
        \       raise SystemExit('Credential cleanup requires the trusted runner administrator')\n   \
        \ rewrite('/etc/nix/nix.conf', 0)\nASSBOX_CLEAR_NIX_CREDENTIALS\nsudo systemctl restart nix-daemon.service\n\
        nix config show --json | /usr/bin/python3 -I -B -c 'import json,sys; assert json.load(sys.stdin)[\"\
        access-tokens\"][\"value\"] == {}, \"Nix API credentials remain configured\"'"
    - name: Authenticate the unchanged native kernel; no kernel compilation
      shell: bash
      run: "set -euo pipefail\nmarker=\"$(cat /proc/sys/kernel/random/uuid)\"\nprintf '::stop-commands::%s\\\
        n' \"$marker\"\n/usr/bin/python3 -I -B <<'ASSBOX_REVIEWED_INSTALL_CONTROLLER'\n\"\"\"Independently\
        \ authenticate and import the native kernel experiment, anonymously.\"\"\"\nimport base64\nimport\
        \ hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\nimport\
        \ sys\nimport time\nimport urllib.parse\nimport urllib.request\n\nCORE = '4e4362b7f27c0898589f4898684c8d627598cfa9'\n\
        LOCK = 'cad32dd620f1dc0a379bf03746816e0d91f3b874a9bef8e6e94eb535836f3b86'\nassert os.environ['GITHUB_REPOSITORY']\
        \ == 'assboxai/assbox'\nassert os.environ['GITHUB_REPOSITORY_ID'] == '1402455771'\nassert os.environ['GITHUB_REPOSITORY_OWNER_ID']\
        \ == '327835666'\nassert os.environ['GITHUB_REF'] == 'refs/heads/test-native-arm-install-diagnostics-v45'\n\
        assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'\nsystem = os.environ['ASSBOX_CANDIDATE_SYSTEM']\n\
        assert system in ('x86_64-linux', 'aarch64-linux')\nimport platform\nassert platform.machine()\
        \ == system.removesuffix('-linux')\nroot = Path(os.environ['GITHUB_WORKSPACE']) / 'product'\n\
        STATE = Path(os.environ['RUNNER_TEMP']) / ('assbox-candidate-preseed-' + system)\nSTATE.mkdir(mode=0o700)\n\
        run = dict(id=37101091605, run_attempt=1,\n           head_sha='b790f6bfa442f6b8905bee0011ecb4a170e574ac',\n\
        \           head_branch='test-kernel-complete-cache',\n           html_url='https://github.com/assboxai/assbox/actions/runs/37101091605')\n\
        tag = f\"kernel-{run['id']}-{run['run_attempt']}-{system}-dev\"\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\
        \    def redirect_request(self, *args, **kwargs):\n        raise RuntimeError('Unexpected anonymous\
        \ API redirect')\nopener = urllib.request.build_opener(NoRedirect())\nrequest = urllib.request.Request('https://api.github.com/repos/assboxai/assbox/releases/tags/'\
        \ + tag\n                                 + '?assbox_observation=' + str(int(time.time())),\n\
        \                                 headers={'Accept': 'application/vnd.github+json', 'User-Agent':\
        \ 'assbox-anonymous-kernel-cache-client',\n                                          'Cache-Control':\
        \ 'no-cache'})\nwith opener.open(request, timeout=30) as response:\n    raw_metadata = response.read(1024**2\
        \ + 1)\n    assert len(raw_metadata) <= 1024**2\nrelease = json.loads(raw_metadata)\nassert release['tag_name']\
        \ == tag and release['immutable'] is True and release['prerelease'] is True and release['draft']\
        \ is False\nassets = {asset['name']: asset for asset in release['assets']}\nassert len(assets)\
        \ == len(release['assets']) and 5 <= len(assets) <= 483\nassert {'kernel-manifest.json', 'kernel-manifest.sigstore.json',\
        \ 'nix-cache-info'} <= set(assets)\nassert sum(asset['size'] for asset in assets.values()) <=\
        \ 8 * 1024**3 + 2 * 1024**2\noutput = STATE / ('native-kernel-complete-public-' + system)\noutput.mkdir(mode=0o700)\n\
        def download_once(name, maximum):\n    asset = assets[name]\n    assert type(asset['size']) is\
        \ int and 0 < asset['size'] <= maximum\n    assert re.fullmatch(r'sha256:[0-9a-f]{64}', asset['digest'])\n\
        \    expected = 'https://github.com/assboxai/assbox/releases/download/' + tag + '/' + name\n \
        \   assert asset['browser_download_url'] == expected\n    class AssetRedirect(urllib.request.HTTPRedirectHandler):\n\
        \        redirects = 0\n        def redirect_request(self, req, fp, code, msg, headers, newurl):\n\
        \            parsed = urllib.parse.urlsplit(newurl)\n            self.redirects += 1\n       \
        \     assert self.redirects <= 2 and parsed.scheme == 'https'\n            assert parsed.hostname\
        \ == 'release-assets.githubusercontent.com' and not parsed.username and not parsed.password\n\
        \            assert not any(key.lower() == 'authorization' for key in req.headers)\n         \
        \   return super().redirect_request(req, fp, code, msg, headers, newurl)\n    client = urllib.request.build_opener(AssetRedirect())\n\
        \    hasher = hashlib.sha256()\n    count = 0\n    path = output / name\n    descriptor = os.open(path,\
        \ os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o600)\n    with os.fdopen(descriptor,\
        \ 'wb') as stream:\n        public = urllib.request.Request(expected, headers={'User-Agent': 'assbox-anonymous-kernel-cache-client'})\n\
        \        with client.open(public, timeout=120) as response:\n            for block in iter(lambda:\
        \ response.read(1024**2), b''):\n                count += len(block)\n                assert count\
        \ <= maximum and count <= asset['size']\n                stream.write(block)\n               \
        \ hasher.update(block)\n    assert count == asset['size'] and hasher.hexdigest() == asset['digest'].removeprefix('sha256:')\n\
        \    return dict(size=count, sha256=hasher.hexdigest(), authorization_sent=False)\n# Retry only\
        \ transient anonymous HTTP transport failures. Every attempt still\n# enforces URL, asset digest,\
        \ provenance, and NAR signature checks.\nimport urllib.error\nimport stat\n\ndef download(name,\
        \ maximum):\n    for number in range(3):\n        try:\n            return download_once(name,\
        \ maximum)\n        except urllib.error.HTTPError as error:\n            if error.code not in\
        \ (429, 500, 502, 503, 504) or number == 2:\n                raise RuntimeError('Anonymous public\
        \ asset returned HTTP ' + str(error.code)) from None\n            partial = output / name\n  \
        \          if partial.exists():\n                metadata = partial.lstat()\n                assert\
        \ stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1\n                assert metadata.st_uid\
        \ == os.getuid() and partial.parent == output\n                partial.unlink()\n            time.sleep(2\
        \ * (number + 1))\n    raise AssertionError('Bounded public download attempts exhausted')\n\n\
        proof = {name: download(name, 1024**2) for name in ('kernel-manifest.json', 'kernel-manifest.sigstore.json')}\n\
        home = STATE / ('native-kernel-complete-anonymous-home-' + system)\nhome.mkdir(mode=0o700)\nenvironment\
        \ = {'PATH': '/nix/var/nix/profiles/default/bin:/usr/bin:/bin', 'HOME': str(home),\n         \
        \      'XDG_CACHE_HOME': str(home / 'cache'), 'GH_CONFIG_DIR': str(home / 'gh'),\n           \
        \    'NIX_USER_CONF_FILES': '/dev/null', 'LANG': 'C.UTF-8', 'GH_PROMPT_DISABLED': '1'}\nassert\
        \ subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', 'rev-parse', 'HEAD'], cwd=root,\
        \ env=environment, text=True).strip() == CORE\nassert not subprocess.check_output(['git', '-c',\
        \ 'core.hooksPath=/dev/null', 'status', '--porcelain'], cwd=root, env=environment)\nassert hashlib.sha256((root\
        \ / 'flake.lock').read_bytes()).hexdigest() == LOCK\nassert json.loads(subprocess.check_output(['nix',\
        \ 'config', 'show', '--json'], env=environment))['access-tokens']['value'] == {}\n# Build only\
        \ the reviewed anonymous verification client from the production pin.\nexpression = ('let f =\
        \ builtins.getFlake ' + json.dumps(str(root)) + '; '\n              + 'p = import f.inputs.nixpkgs\
        \ { system = ' + json.dumps(system) + '; }; '\n              + 'in p.callPackage ' + json.dumps(str(root\
        \ / 'nix/anonymous-gh.nix')) + ' {}')\ngh_output = subprocess.check_output(['nix', 'build', '--impure',\
        \ '--no-link', '--print-out-paths',\n    '--no-update-lock-file', '--no-write-lock-file', '--expr',\
        \ expression], cwd=root, env=environment, text=True).strip()\nassert re.fullmatch(r'/nix/store/[0-9abcdfghijklmnpqrsvwxyz]{32}-gh-[^/]+',\
        \ gh_output)\ngh = str(Path(gh_output) / 'bin/gh')\nidentity = 'https://github.com/assboxai/assbox/.github/workflows/verify.yml@refs/heads/test-kernel-complete-cache'\n\
        command = [gh, 'attestation', 'verify', str(output / 'kernel-manifest.json'), '--bundle', str(output\
        \ / 'kernel-manifest.sigstore.json'),\n           '--repo', 'assboxai/assbox', '--cert-identity',\
        \ identity, '--source-ref', 'refs/heads/test-kernel-complete-cache',\n           '--source-digest',\
        \ run['head_sha'], '--signer-digest', run['head_sha'], '--cert-oidc-issuer', 'https://token.actions.githubusercontent.com',\n\
        \           '--deny-self-hosted-runners', '--predicate-type', 'https://slsa.dev/provenance/v1',\
